# Publishes to npm via Trusted Publishing (OIDC) -- no long-lived npm
# token/secret involved. Requires a matching Trusted Publisher configured
# on the package's npmjs.com settings: GitHub Actions, owner/repo
# thevahidal/soul, workflow filename `npm-publish.yml`, action `npm publish`
# allowed. See https://docs.npmjs.com/trusted-publishers.
#
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package

on:
  release:
    types: [created]

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      # Trusted Publishing needs npm CLI >=11.5.1; the version bundled with
      # setup-node's Node 22 isn't guaranteed to be that recent.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm publish
