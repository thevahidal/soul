# Publishes to npm via Trusted Publishing (OIDC), no npm token involved.
# The Trusted Publisher on npmjs.com must point at workflow file `release.yml`.
# Publishing lives here because releases created with GITHUB_TOKEN don't
# trigger other workflows.

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4

  publish-npm:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      # Trusted Publishing needs npm CLI >=11.5.1
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm publish
